services:
  - type: web
    name: alertu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUSH_PROVIDER
        value: fcm
      - key: PUSH_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: FIREBASE_PROJECT_ID
        value: alertu-a7a43
      # Set these in the Render dashboard when the service is created.
      - key: DATABASE_URL
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Comma-separated browser origin(s) for the web frontend.
      - key: CORS_ORIGIN
        value: https://alertu-frontend.vercel.app
